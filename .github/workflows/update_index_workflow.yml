name: 更新全收益指数数据

on:
  # 仅手动触发：仓库 Actions 页面 → 本工作流 → Run workflow
  # 已移除全部 schedule 定时任务，不再自动运行，避免空跑消耗 Wind 积分。
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          # 与本地开发环境（Python 3.11 + pandas 3.x）保持一致，避免版本差异导致的取数异常
          python-version: '3.11'

      - name: 安装计算依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy scipy xlrd openpyxl

      - name: 抓取最新点位、ETF 收盘价并同步重算指标
        env:
          TZ: Asia/Shanghai
          # Wind Alice 官方数据通道：仓库 Settings → Secrets and variables → Actions
          # 新建 secret 名称 WIND_API_KEY，值填 ak_ 开头的 API Key。
          # 未配置时脚本自动回退到推算口径，不会报错中断。
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
        run: python -u auto_update_indices.py

      - name: 提交并推送更新后的文件
        run: |
          # 检测全部变更（网页 + 脚本可能同步调整），无变化则直接结束
          if git diff --quiet; then
            echo "未检测到新的交易日数据、指标或 ETF 价格变化。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 明确列出交付文件，避免把运行时产物（如 __pycache__）一并提交
          git add 指数分析工具.html auto_update_indices.py 配置说明.md
          git commit -m "chore: 自动更新全收益指数点位、ETF 分位线价格与估值分位 [skip ci]"
          if ! git push; then
            echo "::warning::推送失败：若仓库 main 分支开启了保护，请在 Settings → Branches 关闭保护，或改用个人访问令牌（PAT）授权推送。"
            exit 0
          fi
