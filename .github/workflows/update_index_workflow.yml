name: 更新全收益指数数据

on:
  # 保留手动触发入口
  workflow_dispatch:
  # 北京时间工作日 21:30（UTC 13:30）自动跑，覆盖 A 股收盘后数据更新时段
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装计算依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy scipy xlrd openpyxl

      - name: 抓取最新点位、ETF 收盘价并同步重算指标
        env:
          TZ: Asia/Shanghai
        run: python -u auto_update_indices.py

      - name: 提交并推送更新后的网页
        run: |
          if git diff --quiet -- 指数全收益定投策略.html; then
            echo "未检测到新的交易日数据、指标或 ETF 价格变化。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 指数全收益定投策略.html
          git commit -m "chore: 自动更新全收益指数点位、ETF 分位线价格与估值分位 [skip ci]"
          git push
